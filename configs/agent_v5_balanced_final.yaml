name: agent_v5_balanced_final
paths:
  figures_dir: data/figures
  router_data_dir: data_router
  router_ckpt: checkpoints/router.pth
  sem_ckpt: train_ckpt/agent_v5_balanced_final/sem.pt
  arbiter_ckpt: train_ckpt/agent_v5_balanced_final/arbiter/model.joblib
  scaler_ckpt: train_ckpt/agent_v5_balanced_final/arbiter/scaler.joblib
  train_ckpt_dir: train_ckpt/agent_v5_balanced_final
  output_dir: outputs/agent_v5_balanced_final
  features_csv: outputs/agent_v5_balanced_final/features.csv
siglip:
  pretrained: /home/jovyan/.cache/huggingface/hub/models--google--siglip-base-patch16-224/snapshots/7fd15f0689c79d79e38b1c2e2e2370a7bf2761ed
  max_text_length: 128
  batch_size: 64
sem_train:
  epochs: 8
  batch_size: 32
  lr_head: 1.0e-4
  lr_backbone: 2.0e-6
  weight_decay: 0.01
  test_ratio: 0.2
  freeze_backbone_epochs: 1
  seed: 42
  loss_type: weighted_bce
  pair_aware_batches: true
  pairwise_loss_weight: 0.2
  pairwise_margin: 0.2
  refit_all: true
router:
  classes: [byt, video, graph, scheme]
  image_size: 224
arbiter:
  decision_threshold: null
  feature_batch_size: 64
  ocr_batch_size: 128
  ocr_use_gpu: true
device: cuda
