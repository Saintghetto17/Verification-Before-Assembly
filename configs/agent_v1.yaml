name: agent_v1

paths:
  figures_dir: data/figures
  router_data_dir: data_router
  output_dir: outputs/agent_v1
  router_ckpt: outputs/agent_v1/router.pth
  arbiter_ckpt: outputs/agent_v1/arbiter.pkl
  scaler_ckpt: outputs/agent_v1/scaler.pkl
  features_csv: outputs/agent_v1/features.csv

siglip:
  pretrained: "/home/jovyan/.cache/huggingface/hub/models--google--siglip-base-patch16-224/snapshots/7fd15f0689c79d79e38b1c2e2e2370a7bf2761ed"
  max_text_length: 64
  batch_size: 8

router:
  classes: [byt, video, graph, scheme]
  image_size: 224
  # GPU defaults (for quick local CPU smoke: epochs=5, batch=32, n=100/20)
  epochs: 15
  batch_size: 64
  learning_rate: 1.0e-4
  num_per_class_train: 250
  num_per_class_val: 50
  # video обогащается реальными figures (кроме golden)
  num_video_train: 800
  num_video_val: 160
  seed: 42

arbiter:
  test_ratio: 0.2          # internal val from TRAIN figures (for threshold / early metrics)
  seed: 42
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.1
  # null → use threshold fitted at train_arbiter (max F1 on holdout), saved in arbiter.pkl
  decision_threshold: null
  # balance match vs mismatch when building features from data/figures
  max_clean_per_corrupted: 3.0

device: cuda  # falls back to cpu if unavailable
limit: null
